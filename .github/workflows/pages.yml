name: Deploy landing to GitHub Pages

# Deploys the static landing site at landing/public/ to GitHub Pages.
# Runs on every push to main that touches landing/, plus on-demand via
# the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - "landing/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single concurrent deployment — newer pushes cancel in-flight runs so
# we never race ourselves.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pages serves whatever's in this directory at the apex.
          path: landing/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
