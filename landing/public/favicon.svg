<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Bullseye favicon — matches the Win11-style "simplified centered"
       app icon (desktop logo.ico). White rounded-square plate so the
       icon reads as a proper app icon on dark browser tabs instead of
       a stray bullseye floating on the chrome. Geometry mirrors
       draw_simplified_centered() in desktop/build/generate_icon.py at
       size 32: corner radius 18% (≈6px), r_outer ~11.5, r_mid ~7.4,
       r_dot 3.2, stroke 2. -->
  <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="#ffffff"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#1a1614" stroke-width="2"/>
  <circle cx="16" cy="16" r="7.4"  fill="none" stroke="#1a1614" stroke-width="2"/>
  <circle cx="16" cy="16" r="3.2"  fill="#c0202a"/>
</svg>
