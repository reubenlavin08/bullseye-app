<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email confirmed · Bullseye</title>
    <meta name="description" content="Your Bullseye email is confirmed. Open the desktop app to sign in.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="256x256" href="/logo.png">
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="/" class="brand">
                <svg viewBox="0 0 32 32" width="22" height="22" fill="none" aria-hidden="true">
                    <circle cx="14" cy="18" r="13" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="14" cy="18" r="8"  stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="14" cy="18" r="3.5" fill="#c0202a"/>
                    <line x1="22" y1="10" x2="14" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M22 10 L26 6 M22 10 L26 10 M22 10 L22 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                Bullseye
            </a>
        </div>
    </header>

    <section class="success">
        <div class="success-check" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
            </svg>
        </div>
        <h1 id="headline">Email confirmed.</h1>
        <p id="subhead" style="font-size:16px;">
            You can close this tab and go back to the Bullseye app —
            it'll sign you in automatically within a few seconds.
        </p>

        <p class="deeplink muted" style="margin-top:24px;font-size:13px;">
            Don't have the app yet? <a href="/download.html">Download Bullseye for Windows</a>.
        </p>

        <p id="status" role="status" aria-live="polite" class="muted" style="margin-top:24px;font-size:13px;"></p>
    </section>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>© Bullseye</span>
            <span class="links">
                <a href="/">Home</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
                <a href="/changelog.html">Changelog</a>
                <a href="/cookies.html">Cookies</a>
                <a href="mailto:hello@getbullseye.app">hello@getbullseye.app</a>
            </span>
        </div>
    </footer>

    <script>
        /* Email-confirmation landing page.
           Supabase Auth redirects here after the user clicks the
           "Confirm your email" link in their inbox. By the time they
           land here the email is already confirmed in auth.users
           (Supabase does the verify BEFORE the redirect), so this
           page is purely a confirmation surface.

           No deeplink, no "Open Bullseye" button: the desktop app's
           auth screen is already polling /api/auth/email/signin every
           3 seconds with the user's stashed credentials, so the
           moment Supabase marks email_confirmed_at, the next poll
           succeeds and the app auto-transitions to /home. The user
           literally just needs to switch back to the app — no clicks
           needed on this page. (We removed the bullseye:// deeplink
           per user feedback 2026-05-07: it didn't reliably bring the
           app forward, and a non-working button is worse than no
           button.) */
        (function () {
            const params = new URLSearchParams(window.location.hash.substring(1) || window.location.search.substring(1))
            const errorCode = params.get('error_code') || params.get('error')
            const headEl = document.getElementById('headline')
            const subEl = document.getElementById('subhead')
            const statusEl = document.getElementById('status')

            if (errorCode) {
                // Confirmation failed (expired token, already used, etc.)
                headEl.textContent = "Couldn't confirm email"
                const desc = params.get('error_description') || params.get('error_code') || errorCode
                subEl.textContent = "Reason: " + decodeURIComponent(desc).replaceAll('+', ' ')
                statusEl.textContent = "If your link expired, sign up again from the Bullseye app to get a fresh one."
            }
        })();
    </script>
</body>
</html>
