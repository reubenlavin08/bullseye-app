<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Changelog — Bullseye</title>
    <meta name="description" content="What's new in Bullseye. Public release notes, sorted newest-first.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="256x256" href="/logo.png">
    <link rel="stylesheet" href="/assets/styles.css">
    <style>
        /* Changelog-specific layout. Lives next to the rest of the
           landing's warm-palette styling but renders pure markdown
           in a comfortable reading column. */
        .cl-wrap { max-width: 720px; margin: 0 auto; padding: 56px 32px 80px; }
        .cl-hero { margin-bottom: 32px; }
        .cl-hero h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 40px;
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin: 0 0 8px;
        }
        .cl-hero p { color: var(--muted); font-size: 15px; margin: 0; }
        .cl-body h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
            font-weight: 400;
            margin: 36px 0 8px;
            letter-spacing: -0.01em;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .cl-body h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            font-weight: 600;
            margin: 18px 0 8px;
        }
        .cl-body p { margin: 8px 0; }
        .cl-body ul { margin: 8px 0 16px; padding-left: 20px; }
        .cl-body li { margin: 4px 0; line-height: 1.6; }
        .cl-body code {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 12.5px;
            background: var(--accent-soft);
            padding: 1px 6px;
            border-radius: 3px;
            color: var(--accent);
        }
        .cl-body strong { color: var(--fg); font-weight: 600; }
        .cl-body em { color: var(--muted); }
        .cl-body a { color: var(--accent); }
        .cl-loading { color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="site-header-inner">
            <a href="/" class="brand">
                <svg viewBox="0 0 32 32" width="22" height="22" fill="none" aria-hidden="true">
                    <circle cx="14" cy="18" r="13" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="14" cy="18" r="8"  stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="14" cy="18" r="3.5" fill="#c0202a"/>
                    <line x1="22" y1="10" x2="14" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M22 10 L26 6 M22 10 L26 10 M22 10 L22 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                Bullseye
            </a>
            <nav class="site-nav">
                <a href="/pricing">Pricing</a>
                <a href="/download.html" class="cta-mini">Download</a>
            </nav>
        </div>
    </header>

    <main class="cl-wrap">
        <div class="cl-hero">
            <h1>What's new</h1>
            <p>Public release notes for Bullseye. Newest first.</p>
        </div>

        <article id="cl-body" class="cl-body">
            <p class="cl-loading">Loading changelog…</p>
        </article>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>© Bullseye</span>
            <span class="links">
                <a href="/">Home</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
                <a href="/cookies.html">Cookies</a>
                <a href="mailto:hello@getbullseye.app">hello@getbullseye.app</a>
            </span>
        </div>
    </footer>

    <script>
        /* Tiny markdown→HTML renderer. Just enough for the keep-a-changelog
         * subset we use: # headings, lists, **bold**, _italic_, `code`,
         * [link](url). No nested lists, no tables. Avoids pulling in a
         * full md library (would be ~30KB) for a 200-line file. */
        (function () {
            "use strict";

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }

            function renderInline(s) {
                // Order matters: code first so its contents aren't
                // re-parsed; then links, bold, italic, escape.
                var out = escapeHtml(s);
                // restore inline-code spans (the markdown source uses
                // backticks; we already escaped them so they're now
                // literal `text`, but keep them intact)
                out = out.replace(/`([^`]+)`/g, function (_, c) {
                    return "<code>" + c + "</code>";
                });
                out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
                    return '<a href="' + u + '">' + t + "</a>";
                });
                out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
                out = out.replace(/(^|[^_])_([^_]+)_/g, "$1<em>$2</em>");
                return out;
            }

            function mdToHtml(md) {
                // Strip front matter if any
                md = md.replace(/^---[\s\S]*?---\n/, "");
                var lines = md.split(/\r?\n/);
                var out = [];
                var inList = false;
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (/^### /.test(line)) {
                        if (inList) { out.push("</ul>"); inList = false; }
                        out.push("<h3>" + renderInline(line.slice(4)) + "</h3>");
                    } else if (/^## /.test(line)) {
                        if (inList) { out.push("</ul>"); inList = false; }
                        out.push("<h2>" + renderInline(line.slice(3)) + "</h2>");
                    } else if (/^# /.test(line)) {
                        // Skip top-level "# Changelog" — we already
                        // render our own h1 above.
                        if (inList) { out.push("</ul>"); inList = false; }
                    } else if (/^- /.test(line)) {
                        if (!inList) { out.push("<ul>"); inList = true; }
                        out.push("<li>" + renderInline(line.slice(2)) + "</li>");
                    } else if (line.trim() === "") {
                        if (inList) { out.push("</ul>"); inList = false; }
                    } else {
                        if (inList) { out.push("</ul>"); inList = false; }
                        out.push("<p>" + renderInline(line) + "</p>");
                    }
                }
                if (inList) out.push("</ul>");
                return out.join("\n");
            }

            async function load() {
                var bodyEl = document.getElementById("cl-body");
                try {
                    // CHANGELOG.md is bundled into the landing site as a
                    // static asset. The Cloudflare Pages build needs to
                    // copy desktop/CHANGELOG.md → landing/public/CHANGELOG.md
                    // (or we can paste it here at build time). For the
                    // simplest first version we point at /CHANGELOG.md
                    // and rely on the build step to place the file.
                    var r = await fetch("/CHANGELOG.md", { cache: "no-store" });
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    var md = await r.text();
                    bodyEl.innerHTML = mdToHtml(md);
                } catch (e) {
                    bodyEl.innerHTML =
                        '<p class="cl-loading">Could not load changelog ' +
                        '(' + e.message + '). ' +
                        '<a href="https://github.com/reubenlavin08/bullseye-app/blob/main/desktop/CHANGELOG.md">' +
                        'View on GitHub</a> instead.</p>';
                }
            }

            load();
        })();
    </script>
</body>
</html>
