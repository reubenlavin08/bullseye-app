<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Bullseye</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='shell.css') }}">
</head>
<body class="auth-body">
    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-brand">
                <svg class="auth-mark" width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
                    <circle cx="14" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="1.25"/>
                    <circle cx="14" cy="18" r="8" fill="none" stroke="currentColor" stroke-width="1.25"/>
                    <circle cx="14" cy="18" r="3.5" fill="var(--logo-red)"/>
                    <line x1="22" y1="10" x2="14" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M22 10 L26 6 M22 10 L26 10 M22 10 L22 6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" fill="none"/>
                </svg>
            </div>
            <div class="kicker auth-kicker">Bullseye</div>
            <h1 class="auth-h1">Welcome back</h1>
            <p class="auth-sub muted">Sign in to keep hunting Marketplace.</p>

            <!-- Sign in / Sign up tabs -->
            <div class="auth-mode-tabs" role="tablist">
                <button type="button" class="auth-mode-tab is-active"
                        data-auth-mode="signin" role="tab">Sign in</button>
                <button type="button" class="auth-mode-tab"
                        data-auth-mode="signup" role="tab">Create account</button>
            </div>

            <!-- Email + password form. Same fields for both modes; submit
                 hits a different endpoint based on which tab is active. -->
            <form id="email-form" class="auth-email-form" autocomplete="on">
                <div class="field">
                    <label class="field-label" for="auth-email">Email</label>
                    <input type="email" id="auth-email" name="email" required
                           autocomplete="email"
                           placeholder="you@example.com">
                </div>
                <div class="field">
                    <label class="field-label" for="auth-password">Password</label>
                    <input type="password" id="auth-password" name="password" required
                           minlength="8" autocomplete="current-password"
                           placeholder="at least 8 characters">
                </div>
                <button type="submit" id="email-submit" class="btn btn-primary auth-cta">
                    <span data-mode-text="signin">Sign in</span>
                    <span data-mode-text="signup" hidden>Create account</span>
                </button>
                <div class="auth-status muted" id="email-status" role="status" aria-live="polite"></div>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <button id="google-signin" type="button" class="btn auth-cta">
                Continue with Google
            </button>

            <div class="auth-status muted" id="auth-status" role="status" aria-live="polite"></div>

            <button id="manual-continue" type="button" class="btn auth-secondary"
                    style="margin-top:10px;display:none;width:100%;">
                I'm signed in &mdash; continue
            </button>

            <p class="auth-fineprint muted">
                Your Facebook account is never used or accessed.
            </p>
        </section>
    </main>

    <script>
        (function () {
            "use strict";
            var googleBtn = document.getElementById("google-signin");
            var googleStatus = document.getElementById("auth-status");
            var manualBtn = document.getElementById("manual-continue");
            var emailForm = document.getElementById("email-form");
            var emailStatus = document.getElementById("email-status");
            var emailSubmit = document.getElementById("email-submit");
            var modeTabs = document.querySelectorAll(".auth-mode-tab");
            var modeTextEls = document.querySelectorAll("[data-mode-text]");
            var emailField = document.getElementById("auth-email");
            var passwordField = document.getElementById("auth-password");

            var currentMode = "signin";
            var pollHandle = null;
            var confirmPollHandle = null;

            /* showAwaitingConfirmation — replace the form with a clear
               "Check your inbox" success card and start auto-poll for
               sign-in. Stashed credentials are JS-scope only (never
               persisted) and disappear from memory if the user
               navigates away or reloads. */
            function showAwaitingConfirmation(email, password) {
                if (pollHandle) { clearInterval(pollHandle); pollHandle = null; }
                if (confirmPollHandle) { clearInterval(confirmPollHandle); }
                // Hide the form + tabs while waiting; show a success card.
                emailForm.style.display = "none";
                document.querySelector(".auth-mode-tabs").style.display = "none";
                var divider = document.querySelector(".auth-divider");
                if (divider) divider.style.display = "none";
                if (googleBtn) googleBtn.style.display = "none";

                var existing = document.getElementById("await-confirm-card");
                if (existing) existing.remove();
                var card = document.createElement("div");
                card.id = "await-confirm-card";
                card.style.cssText =
                    "background:var(--accent-2-soft);border:1px solid var(--good);" +
                    "border-radius:var(--radius-card);padding:24px;margin-top:8px;" +
                    "text-align:left;";
                card.innerHTML =
                    '<div class="kicker" style="color:var(--good);">account created</div>' +
                    '<h3 style="font-family:var(--serif);font-size:18px;margin:8px 0 4px;font-weight:500;">' +
                        "Check your inbox" +
                    "</h3>" +
                    '<p style="margin:8px 0;font-size:13.5px;line-height:1.55;">' +
                        "We sent a confirmation link to <strong>" +
                        String(email).replace(/[<>&"]/g, function (c) {
                            return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];
                        }) +
                        "</strong>. Click it to verify your email — we'll sign you in here automatically." +
                    "</p>" +
                    '<p class="muted" style="font-size:12px;margin-top:14px;">' +
                        "Don't see it? Check your spam / junk folder — " +
                        "Outlook and Gmail sometimes route new senders there. " +
                        "Mark it as Not Junk so future Bullseye emails reach your inbox." +
                    "</p>" +
                    '<div id="await-confirm-status" class="muted" ' +
                        'style="margin-top:14px;font-size:12px;"></div>' +
                    // Resend + cancel actions side-by-side
                    '<div style="margin-top:14px;display:flex;gap:14px;align-items:center;">' +
                        '<button id="await-confirm-resend" type="button" ' +
                            'style="background:none;border:1px solid var(--border-strong);' +
                            'color:var(--fg);padding:6px 12px;border-radius:var(--radius);' +
                            'cursor:pointer;font-size:12px;">' +
                            "Resend email" +
                        "</button>" +
                        '<button id="await-confirm-cancel" type="button" ' +
                            'style="background:none;border:none;color:var(--muted);' +
                            'text-decoration:underline;cursor:pointer;font-size:12px;padding:0;">' +
                            "Use a different email instead" +
                        "</button>" +
                    "</div>";
                emailForm.parentNode.insertBefore(card, emailForm);

                var statusEl = document.getElementById("await-confirm-status");
                statusEl.textContent = "Waiting for you to click the email link…";

                // Cancel button restores the form for re-entry.
                document.getElementById("await-confirm-cancel")
                    .addEventListener("click", function () {
                        if (confirmPollHandle) clearInterval(confirmPollHandle);
                        card.remove();
                        emailForm.style.display = "";
                        document.querySelector(".auth-mode-tabs").style.display = "";
                        if (divider) divider.style.display = "";
                        if (googleBtn) googleBtn.style.display = "";
                        emailSubmit.disabled = false;
                        emailStatus.textContent = "";
                    });

                // Resend button — request another confirmation email.
                // Supabase rate-limits at 60s; we throttle the button
                // for the same window so users can't spam-click and
                // see the same 429 over and over.
                var resendBtn = document.getElementById("await-confirm-resend");
                resendBtn.addEventListener("click", async function () {
                    if (resendBtn.disabled) return;
                    resendBtn.disabled = true;
                    var origText = resendBtn.textContent;
                    resendBtn.textContent = "Sending…";
                    statusEl.style.color = "";
                    statusEl.textContent = "";
                    try {
                        var r = await fetch("/api/auth/email/resend", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email: email }),
                        });
                        var rd = await r.json();
                        if (r.ok && rd.ok) {
                            statusEl.style.color = "var(--good)";
                            statusEl.textContent =
                                "Sent. Check your inbox (and junk folder).";
                        } else {
                            statusEl.style.color = "var(--bad)";
                            statusEl.textContent =
                                rd.message || rd.error ||
                                "Could not resend. Try again in a minute.";
                        }
                    } catch (e) {
                        statusEl.style.color = "var(--bad)";
                        statusEl.textContent = "Network error. Try again.";
                    }
                    // Cooldown: 60s lockout on the button matches
                    // Supabase's server-side rate limit.
                    var secondsLeft = 60;
                    function tick() {
                        if (secondsLeft <= 0) {
                            resendBtn.disabled = false;
                            resendBtn.textContent = origText;
                            return;
                        }
                        resendBtn.textContent = "Resend in " + secondsLeft + "s";
                        secondsLeft--;
                        setTimeout(tick, 1000);
                    }
                    tick();
                });

                // Poll signin every 3s. While email_confirmed_at is NULL
                // Supabase returns 400 "Email not confirmed". Once the
                // user clicks the link, the next poll succeeds and we
                // transition to /home.
                var pollAttempts = 0;
                confirmPollHandle = setInterval(async function () {
                    pollAttempts++;
                    try {
                        var r = await fetch("/api/auth/email/signin", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                email: email,
                                password: password,
                            }),
                        });
                        var data = await r.json();
                        if (r.ok && data.ok) {
                            clearInterval(confirmPollHandle);
                            statusEl.style.color = "var(--good)";
                            statusEl.textContent = "Email confirmed. Signing you in…";
                            setTimeout(function () {
                                window.location.href = "/home";
                            }, 600);
                        } else if (pollAttempts > 100) {
                            // 5 min timeout — stop polling and let the
                            // user retry manually rather than spam
                            // the auth endpoint forever.
                            clearInterval(confirmPollHandle);
                            statusEl.textContent =
                                "Still waiting. Click 'Use a different email' " +
                                "to start over, or refresh the page once you've " +
                                "confirmed your email.";
                        }
                    } catch (e) { /* network blip; keep polling */ }
                }, 3000);
            }

            // Single-shot status check. Called on page load + on every
            // focus/visibility event. pywebview throttles setInterval
            // aggressively when backgrounded, so multiple triggers give
            // us several chances to detect a successful sign-in.
            async function checkAuth() {
                try {
                    var s = await fetch("/api/auth/status",
                        { cache: "no-store",
                          headers: { "Cache-Control": "no-store" } });
                    var sd = await s.json();
                    if (sd.logged_in) {
                        if (pollHandle) clearInterval(pollHandle);
                        googleStatus.textContent = "Signed in. Loading...";
                        // Apply pending referral code (if any was stashed
                        // from a ?ref=XYZ URL hit before sign-in).
                        try {
                            var pending = localStorage.getItem("bullseye_pending_ref");
                            if (pending) {
                                fetch("/api/referral/claim", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ code: pending }),
                                });
                                localStorage.removeItem("bullseye_pending_ref");
                            }
                        } catch (e) { /* localStorage may not exist */ }
                        window.location.replace("/home");
                        return true;
                    }
                } catch (e) { /* transient */ }
                return false;
            }

            window.addEventListener("focus", checkAuth);
            document.addEventListener("visibilitychange", function () {
                if (!document.hidden) checkAuth();
            });
            window.addEventListener("pageshow", checkAuth);
            checkAuth();

            // ---------- mode tabs (Sign in vs Create account) ----------
            modeTabs.forEach(function (tab) {
                tab.addEventListener("click", function () {
                    currentMode = tab.getAttribute("data-auth-mode");
                    modeTabs.forEach(function (t) {
                        t.classList.toggle("is-active", t === tab);
                    });
                    modeTextEls.forEach(function (el) {
                        el.hidden = el.getAttribute("data-mode-text") !== currentMode;
                    });
                    passwordField.setAttribute(
                        "autocomplete",
                        currentMode === "signup" ? "new-password" : "current-password"
                    );
                    emailStatus.textContent = "";
                    emailStatus.style.color = "";
                });
            });

            // ---------- email + password submit ----------
            emailForm.addEventListener("submit", async function (ev) {
                ev.preventDefault();
                var email = emailField.value.trim();
                var password = passwordField.value;
                if (!email || !password) {
                    emailStatus.style.color = "var(--bad)";
                    emailStatus.textContent = "Email and password required.";
                    return;
                }
                emailSubmit.disabled = true;
                emailStatus.style.color = "";
                emailStatus.textContent = currentMode === "signup"
                    ? "Creating account..."
                    : "Signing in...";
                var endpoint = currentMode === "signup"
                    ? "/api/auth/email/signup"
                    : "/api/auth/email/signin";
                try {
                    var r = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email, password: password }),
                    });
                    var data = await r.json();
                    if (!r.ok || !data.ok) {
                        emailStatus.style.color = "var(--bad)";
                        emailStatus.textContent = data.error || ("HTTP " + r.status);
                        emailSubmit.disabled = false;
                        return;
                    }
                    if (data.needs_confirmation) {
                        // SIGNUP-WITH-CONFIRM flow:
                        // The user has been created in auth.users but
                        // their email_confirmed_at is NULL. They MUST
                        // click the link in their inbox before sign-in
                        // works. Instead of dropping them on a generic
                        // "check your email" message and forcing them
                        // to manually flip back to the Sign in tab and
                        // re-type credentials, we:
                        //   1. Hide the form, show a clear success card
                        //      with the email address called out
                        //   2. Stash the credentials in JS-only memory
                        //   3. Poll /api/auth/email/signin every 3s with
                        //      those credentials. While unconfirmed it
                        //      400s; the moment they click the email
                        //      link, the next poll succeeds and we
                        //      transition to /home.
                        // Net effect: user clicks email link, returns
                        // to the app, and is already signed in. No
                        // tab-switching, no re-typing.
                        showAwaitingConfirmation(email, password);
                        return;
                    }
                    emailStatus.style.color = "var(--accent-2)";
                    emailStatus.textContent = "Signed in. Loading...";
                    await checkAuth();
                } catch (e) {
                    emailStatus.style.color = "var(--bad)";
                    emailStatus.textContent = "Network error: " + e.message;
                    emailSubmit.disabled = false;
                }
            });

            // ---------- Google OAuth ----------
            googleBtn.addEventListener("click", async function () {
                googleBtn.disabled = true;
                googleStatus.textContent = "Opening Google sign-in...";
                try {
                    var r = await fetch("/api/auth/start", { method: "POST" });
                    var data = await r.json();
                    window.open(data.url, "_blank");
                    googleStatus.textContent = "Waiting for sign-in to complete...";
                    setTimeout(function () {
                        manualBtn.style.display = "block";
                    }, 2000);
                    pollHandle = setInterval(checkAuth, 500);
                } catch (e) {
                    googleBtn.disabled = false;
                    googleStatus.textContent = "Could not start sign-in: " + e.message;
                }
            });

            manualBtn.addEventListener("click", async function () {
                manualBtn.disabled = true;
                manualBtn.textContent = "Checking...";
                var ok = await checkAuth();
                if (!ok) {
                    manualBtn.disabled = false;
                    manualBtn.textContent = "Try again";
                    googleStatus.textContent = "Not signed in yet. Complete the Google sign-in first.";
                }
            });
        })();
    </script>
</body>
</html>
