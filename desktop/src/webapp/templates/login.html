<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in to Bullseye</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1a1614;
            background: #fafaf7;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        main { max-width: 380px; padding: 32px; text-align: center; }
        h1 {
            font-family: Georgia, serif;
            font-weight: 500;
            letter-spacing: -0.02em;
            font-size: 36px;
            margin: 0 0 8px;
        }
        .subtitle { color: #6b5d52; margin-bottom: 32px; font-size: 15px; }
        button {
            background: #1a1614;
            color: #fafaf7;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #c2410c; }
        button:disabled { opacity: 0.6; cursor: wait; }
        .small {
            color: #9a8a7d;
            font-size: 12px;
            margin-top: 24px;
            line-height: 1.5;
        }
        .status {
            color: #5d7a4f;
            font-size: 14px;
            margin-top: 16px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Bullseye</h1>
        <p class="subtitle">Find Marketplace deals before everyone else.</p>

        <button id="google-signin">Sign in with Google</button>

        <div class="status" id="status"></div>

        <p class="small">
            We use Google sign-in so you can keep your watches across
            reinstalls. Your Facebook account is never used or accessed.
        </p>
    </main>

    <script>
        const btn = document.getElementById('google-signin');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = 'Opening Google sign-in...';
            try {
                const r = await fetch('/api/auth/start', { method: 'POST' });
                const data = await r.json();
                // Open Google OAuth in a new window. Tokens come back
                // to the local callback server (port 53682), the
                // background thread captures them.
                window.open(data.url, '_blank');
                status.textContent = 'Waiting for sign-in to complete...';
                // Poll for completion. The OAuth callback writes tokens
                // to keyring + sets is_logged_in() = True. Once that's
                // true, reload to land on the dashboard.
                const poll = setInterval(async () => {
                    try {
                        const s = await fetch('/api/auth/status');
                        const sd = await s.json();
                        if (sd.logged_in) {
                            clearInterval(poll);
                            status.textContent = 'Signed in. Loading...';
                            window.location.href = '/';
                        }
                    } catch (e) { /* ignore transient */ }
                }, 500);
            } catch (e) {
                btn.disabled = false;
                status.textContent = 'Could not start sign-in: ' + e.message;
            }
        });
    </script>
</body>
</html>
