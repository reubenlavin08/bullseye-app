<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Bullseye — Design v2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { margin: 0; height: 100%; background: #f0eee9; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    [data-dc-slot] .dc-card { position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="logo.jsx"></script>
  <script type="text/babel" src="score-viz.jsx"></script>
  <script type="text/babel" src="score-interactive.jsx"></script>
  <script type="text/babel" src="hero-variants.jsx"></script>
  <script type="text/babel" src="landing-v2.jsx"></script>
  <script type="text/babel" src="hub-app.jsx"></script>
  <script type="text/babel" src="email.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="brand" title="Brand" subtitle="Logo B locked in · score uses style 1">
            <DCArtboard id="logo-b"  label="Logo B · concentric + arrow"  width={920} height={760}><LogoSheet/></DCArtboard>
            <DCArtboard id="score-1" label="Score · style 1 · click to reveal breakdown" width={680} height={760}>
              <div className="bs-root" style={{padding: 28, background:'var(--bg)'}}>
                <div className="kicker">score · style 1 · interactive</div>
                <h2 style={{fontSize: 22, marginTop: 6}}>Click the score to see the math.</h2>
                <p className="muted" style={{margin:'4px 0 24px', fontSize: 13}}>
                  Closed by default; one click reveals the full breakdown — reasoning rows AND the 23 comps it used.
                </p>
                <ScoreBigInteractive defaultOpen={false}/>
                <p className="muted" style={{fontSize: 12, marginTop: 16}}><em>(Try clicking the "78" or the "why?" pill.)</em></p>
              </div>
            </DCArtboard>
            <DCArtboard id="score-1-open" label="Score · style 1 · breakdown open" width={680} height={1280}>
              <div className="bs-root" style={{padding: 28, background:'var(--bg)'}}>
                <div className="kicker">score · breakdown panel</div>
                <h2 style={{fontSize: 22, marginTop: 6}}>The full menu.</h2>
                <p className="muted" style={{margin:'4px 0 24px', fontSize: 13}}>
                  Tabs let you flip between <em>How we got 78</em> (math + reasoning) and <em>23 comps</em> (the listings used).
                </p>
                <ScoreBigInteractive defaultOpen/>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection id="hero" title="Hero variants" subtitle="Wireframes — pick a direction to promote to hi-fi">
            <DCArtboard id="hero-wires" label="4 hero directions"  width={1180} height={780}><HeroVariants/></DCArtboard>
          </DCSection>

          <DCSection id="landing" title="Landing v2" subtitle="Reseller framing · Free vs Pro · drops Swoopa">
            <DCArtboard id="land2"  label="Landing — reseller positioning + Free vs Pro" width={1180} height={2080}><LandingV2/></DCArtboard>
            <DCArtboard id="email"  label="Daily digest email"  width={720} height={780}><EmailDigest/></DCArtboard>
          </DCSection>

          <DCSection id="hub" title="Desktop app · Wispr-Hub-style" subtitle="Left sidebar + main · greeting · top deal · feed">
            <DCArtboard id="hub-home" label="Hub · Home" width={1180} height={1280}><HubApp/></DCArtboard>
            <DCArtboard id="event-tail" label="Event tail · cleaned up" width={760} height={420}>
              <div className="bs-root" style={{padding: 24, background:'var(--bg)'}}>
                <EventTailClean/>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
